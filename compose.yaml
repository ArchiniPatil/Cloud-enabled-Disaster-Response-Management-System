services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: response
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: response
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["response-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U response -d response"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  response-data:
